# 桌面版三平台发布工作流：打 tag（v*）自动构建 Win/Mac/Linux 安装包并挂上 Release；
# workflow_dispatch 手动触发只出构建产物、不发布，用于验证。
name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            ext: exe
          - os: macos-latest
            target: mac
            ext: dmg
          - os: ubuntu-latest
            target: linux
            ext: AppImage
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "DESKTOP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Package desktop app
        run: node electron/package-desktop.mjs ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: release/*.ex
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            桌面阅读器安装包（Windows / macOS / Linux）。

            - **macOS 包未签名**：首次打开请右键 → 打开，或终端执行 `xattr -cr /Applications/cmchen-blog-desktop.app`
            - **Linux AppImage**：Ubuntu 24.04+ 需先装 libfuse2（`sudo apt install libfuse2t64`）
            - **Windows**：未签名，SmartScreen 提示时选「仍要运行」即可
