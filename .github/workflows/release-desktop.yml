# 桌面版三平台发布工作流：打 tag（v*）自动构建 Win/Mac/Linux 安装包并挂上 Release；
# workflow_dispatch 手动触发只出构建产物、不发布，用于验证。
name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            ext: exe
          - os: macos-latest
            target: mac
            ext: dmg
          - os: ubuntu-latest
            target: linux
            ext: AppImage
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "DESKTOP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build site (astro + pagefind)
        run: pnpm run build:desktop

      - name: Package desktop app
        run: node electron/package-desktop.mjs ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.target }}
          path: release/*.${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body: |
            ## 本次更新（v1.1.0）

            本版本统一合并 `v1.0.1` ~ `v1.1.1` 的更新内容（历史版本说明已并入下方），并包含最新一轮站点界面改进。

            **站点界面**
            - 归档页全面改版：文章列表统一为单行式（日期 + 标题 + 分类），月份改为细分隔线；悬停行平滑展开摘要，新增弹性缓动、标题位移与左侧指示条动效
            - 侧边栏分类导航重做：由药丸 + 数字徽章改为清单行，新增悬停位移/描边过渡、活动指示条生长动画与按压反馈
            - 二级目录（子分类）切换动画重写：交叉淡入淡出 + 容器高度平滑生长，替代原先的闪断式切换
            - 工具页卡片恢复「倾斜翻面」悬停效果（保留键盘与减动效适配）
            - 修复分类标签配色失效：全站分类标签恢复彩色（明暗主题均已修复）

            **历史更新（并入本版本）**
            - v1.1.x：桌面打包图标改用多尺寸 icon.ico；顶栏 logo 与 slogan 左移避让正文
            - v1.0.1：回退主题切换至原版圆形揭示动画

            ---

            桌面阅读器安装包（Windows / macOS / Linux）。

            - **macOS 包未签名**：首次打开请右键 → 打开，或终端执行 `xattr -cr /Applications/cmchen-blog-desktop.app`
            - **Linux AppImage**：Ubuntu 24.04+ 需先装 libfuse2（`sudo apt install libfuse2t64`）
            - **Windows**：未签名，SmartScreen 提示时选「仍要运行」即可
