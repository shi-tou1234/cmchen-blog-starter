# GitHub Pages 部署工作流
# 需要在仓库 Settings > Pages 中将 Source 设置为 "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Restore Astro build cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.astro
            node_modules/.cache/cover-images.json
            node_modules/.cache/picsum-covers
          key: ${{ runner.os }}-astro-${{ hashFiles('pnpm-lock.yaml', 'astro.config.mjs', 'src/plugins/**', 'src/data/cover-image-config.ts', 'src/utils/cover-image-api.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-${{ hashFiles('pnpm-lock.yaml', 'astro.config.mjs', 'src/plugins/**', 'src/data/cover-image-config.ts', 'src/utils/cover-image-api.ts') }}-

      - name: Test cover cache
        run: pnpm test:covers

      - name: Build
        run: |
          pnpm run covers:ensure
          start=$SECONDS
          pnpm exec astro build
          echo "Astro build: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"
          start=$SECONDS
          pnpm run cache:covers
          echo "Original Picsum cover cache: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"
          start=$SECONDS
          pnpm exec pagefind --site dist
          echo "Pagefind index: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
